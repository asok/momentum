default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
  host: <%= ENV.fetch("DB_HOST", "localhost") %>
  port: <%= ENV.fetch("DB_PORT", 5432) %>
  username: <%= ENV.fetch("DB_USER", ENV.fetch("USER", "postgres")) %>
  password: <%= ENV.fetch("DB_PASSWORD", "") %>

development:
  primary:
    <<: *default
    database: <%= ENV.fetch("DATABASE_NAME", "momentum_development") %>


test:
  <<: *default
  database: <%= ENV.fetch("DATABASE_NAME", "momentum_test") %>

production:
  primary:
    <<: *default
    database: <%= ENV.fetch("DATABASE_NAME", "momentum_production") %>

